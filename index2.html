<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site en maintenance - IGTER</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #003366, #0055aa);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    background: rgba(0,0,0,0.4);
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    max-width: 500px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
    letter-spacing: 1px;
}

h1 {
    font-size: 32px;
    margin: 20px 0;
}

p {
    font-size: 16px;
    line-height: 1.6;
    opacity: 0.9;
}

.icon {
    font-size: 60px;
    margin-bottom: 10px;
}

.footer {
    margin-top: 25px;
    font-size: 13px;
    opacity: 0.7;
}
</style>
</head>

<div class="container">

    <div class="logo">IGTER</div>

    <div class="icon">🔧</div>

    <h1>Site en maintenance</h1>

        <br><br>
        Merci de votre compréhension.

    <div class="footer">
        © 2026 IGTER - République Démocratique du Congo
    </div>
